dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.3
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

  # --- FASE 2 dev deps ---
  # injectable_generator: ^2.4.2
  # drift_dev: ^2.19.1
  # build_runner: ^2.4.9

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "logo1.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "logo1.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/models/
    - assets/three/
    - assets/three/vendor/
    - assets/three/addons/controls/
    - assets/three/addons/loaders/
    - assets/three/addons/utils/
